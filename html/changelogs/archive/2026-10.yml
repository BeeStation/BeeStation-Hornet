2026-10-15:
  mrmanlikesbt, TheBoondock:
  - balance: TTVs now have a 3x larger bomb cap outside of syndicate bombs
  - balance: TTVs now have a 5 second fuse once they reach critical pressure. During
      this time the TTV will shake vigorously, play a loud rumbling sound, and display
