2026-09-17:
  swatblack:
  - bugfix: fixed an issue of air alarms endlessly trying to replace cold air in rooms
      that are meant to be cold (server rooms) by taking away their scrubbers in all
      applicable maps
  - bugfix: separates the kilo exploration server room and the exploration preparation
      room areas
  - bugfix: fixes the exploration prep room on kilo having hot air under the exterior
      airlock
  - bugfix: connects the radstation ai sat to the atmos loop
  - bugfix: made the plasma canister in the radstation exploration comms area be wrenched
      down by default
  - rscdel: removed omni layer adapters from the "insane atmospheric technician" random
      room since those would, on rare occasion, mix the distro and waste pipenets
  - tweak: decreased pumping rate of the radstation air mixer from maximum to 500
      KpA
  - tweak: increased pumping rate of "air to distro" pumps on meta and kilo from 101
      to 500 KpA
  - tweak: flips the glass in the radstation science server room to avoid it being
      damaged by atmos in some specific scenarios
  - tweak: increased the output rate for supermatter waste injectors from 50L/s to
      200L/s (maximized) on all maps that use them
  - rscadd: added more pipes for the metastation communications
