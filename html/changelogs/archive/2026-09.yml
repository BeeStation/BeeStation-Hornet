2026-09-13:
  r1ks, rkz:
  - bugfix: Fixes cloning randomizing unique enzymes(relevant to blood,  identity
      checks) and non-human appearance, and a few other sources of enzymes not being
      assigned.
  - bugfix: Fixes cloning not respecting the cloned's enzymes, blood type, age
  rkz, nemvar, ArcaneMusic, nightred, MrMelbert, Time-Green, itseasytosee, vinylspiders, kapu1178, san7890:
  - bugfix: mood should stay within sanity levels more consistently
  - bugfix: Fixed an issue where unstable people could regain sanity
  - rscadd: Adds a new surgery, Stomach Pump, which allows you to purge a patient's
      stomach via surgery
  - tweak: The stomach is now needed to eat food or drink
  - tweak: Vomiting now empties the stomach only
  - tweak: adds new system for organ failure, in which when a organ reaches 100 damage,
      it becomes nonfunctional
  - rscadd: Items hidden in bread, cake, and cheeses can now have unique interactions
      when someone bites into it them.
  - code_imp: unit tests reagent code
  - refactor: ethereal & IPC hunger mechanics are now tied to their stomachs. Whether
      you can adequately manage said hunger as someone implanted with said stomach
      is another question entirely.
  - balance: Change liver to not purge toxins instantly for low amounts. Instead the
      toxin effect gets skipped while it is metabolized normally, however it still
      does liver damage. This fixes bite increments for food, cigarettes, and drinks
      where the toxins would purge without building up to harmful levels.
  - balance: Change the formula for how toxins effect livers. Livers will be damaged
      based on the units of toxin present and their lethality.
  - balance: Change alien liver toxin resistance value to be -33% and cybernetic liver
      toxin resistance value to be +50%
  - bugfix: plasmamen no longer can suffer liver failure from injecting themselves
      with plasma (unless they have a human liver for some reason).
  - bugfix: plasmamen no longer can suffer liver failure from consuming other organic
      toxins, which they are not supposed to be affected by.
  - balance: Water now makes you wet on touch and vapor application, with vapor being
      much less effective than touch. Spray bottles of water *can* put someone out.
  - refactor: optimizes INVOKE_ASYNC and makes it pass args correctly
  - code_imp: vomit() now uses bitflag args
  - refactor: Rewrites how addiction points are applied from reagents. Some reagents
      may be marginally more or less addictive as a consequence.
  - balance: Addiction gained per metabolism tick now scales to the amount of reagents
      metabolized. In other words if you metabolize 0.2 units instead of the expected
      0.4 units, you get 0.5x of the amount of addiction gain. This ultimately changes
      very little and I would imagine it's how most people expected it to work in
      the first place...
  - code_imp: command jobs restriction on lowpop is now set via config, default to
      off
  - rscadd: extreme hunger will now cause slowdown and stamina effects. Reaching zero
      satiety will exhaust the carbon.
