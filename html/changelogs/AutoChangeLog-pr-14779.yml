author: Tsar-Salat
delete-after: true
changes:
  - balance: Ninja cloaking is back to partial-invisibility, with a 3 second cooldown
      and no limit on its use. It breaks on bump, attacking, or throwing
  - balance: ninja energy katana is back to 25 force and can block projectiles, subject
      to the 2s block cooldown. Projectiles can only be blocked from ninjas front
  - balance: Ninja dash has 2 charges (3 second recharge). Nerfed/Buffed from 1.4s.
      Slightly worse at combat, better and misc use.
  - balance: Ninja suit melee armor raised to 40 from 10, and gains 50 stamina armor
  - rscadd: Ninjas spawn with a Spider Clan fieldkit, a double emergency oxygen tank,
      and a mouthhole module.
  - qol: Ninja dash tells you charge status
  - bugfix: Ninja cloak now correctly breaks when attacking with a held weapon.
  - bugfix: Ninja cloak no longer replaces your own sprite with an icon.
  - bugfix: Blocking non-brute weapons now correctly gets its stamina discount.
