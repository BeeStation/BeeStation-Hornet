author: rkz, Shroopy, SmArtKar, Melbert
delete-after: true
changes:
  - rscadd: humanoids now blink.
  - rscadd: other species like moths don't visibly blink, whilst lizards blink asynchronously
  - qol: Implanted HUDs can now be toggled on and off with an action.
  - image: Eyes now display their color on their organ sprite, instead of always being
      displayed as blue.
  - bugfix: Fixed an issue where some NPC/midround humans would not get their eye
      color set correctly
  - refactor: Refactored how facial offsets interact with eye rendering, potentially
      optimizing future species that use this feature.
  - refactor: Refactored hair and eye rendering a bit, they're now rendered separately
      to the head - report any oddities with either. Lips too but to a lesser degree.
