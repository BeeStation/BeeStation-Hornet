author: rkz, SyncIt21, cacogen, mothblocks, hatterhat
delete-after: true
changes:
  - rscadd: checks while inserting stack materials into an RPED and their amounts
  - code_imp: sorting of RPED part components to sort stack materials by their ratings
  - rscdel: old way of displaying parts when clicking on an machine frame with it
  - bugfix: Machine frames and circuit boards no longer call manipulators micro-manipulators
      when examined
  - code_imp: makes stock parts stored as datums
  - refactor: stack components no longer exist inside a machine's component_parts
  - refactor: move component printer & module duplicator circuitboards into machine_circuitboards.dm
  - rscadd: RPED can now pick up & install machine circuit boards in machine frames
  - rscadd: RPED can pick up computer circuit boards for storage convenience but doesn't
      install them
  - refactor: RPED to infer icons of parts to use in icon2html() when displaying part
      information
  - rscadd: RPED can carry & install computer boards and complete computer frames
  - balance: Machines now draw most of their power while actually working, rather
      than constantly.
  - balance: Upgrading a machine's parts raises its power draw. Machines that don't
      provide better output when upgraded, like stasis beds, instead get less power
      draw
  - balance: Machine power costs rebalanced downward to pre-2025 levels
  - bugfix: Inducers no longer produce free power when run below their charge rate
  - bugfix: Thermomachines, gas miners, magnets, floodlights and gas sensors now actually
      draw power
  - bugfix: SMES units hold the capacity their parts say they do instead of half of
      it
  - bugfix: Tesla coils no longer generate power from an overloaded grid
  - bugfix: APCs no longer report good external power while dead, and stop flicking
      channels on and off on the threshold
  - bugfix: Holopad power draw no longer creeps upward over a round
  - code_imp: Machines declare how part tiers affect their power draw. Machine power
      is now linted and unit tested against, including roundstart station power budget
