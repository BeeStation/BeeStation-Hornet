author: mrmanlikesbt
delete-after: true
changes:
  - bugfix: Fixed the modsuit GPS having an error overlay when enabled
  - bugfix: Fixed cyborg heads having a no-eyes overlay like normal fleshy heads
  - bugfix: Fixed the debug robotics holodeck having an IPC brain instead of the intended
      positronic brain
  - bugfix: Fixed a person permanently becoming trapped if the cryo cell that they
      were in was broken
  - bugfix: Fixed advanced tools losing their inhand sprite when switching to their
      secondary mode
  - bugfix: Fixed the toilet lock button on BoxStation not bolting the door
  - spellcheck: Mecha construction now correctly refers to the manipulators it requires
      as manipulators instead of servos
