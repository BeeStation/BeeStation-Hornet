author: Ghommie, timothymtorres, jlsnow301, Melbert, SyncIt21, 00-Steven, the-sushi
delete-after: true
changes:
  - qol: Add hotkeys to APCs for AIs and borgs. Toggle environmental (ctrl + shift),
      toggle lighting (shift), toggle equipment (alt), and toggle breaker (ctrl).
  - qol: Many items which previously required you to stand to alt-click now don't,
      such as bedsheets and spray cans
  - qol: improved feedback messages when an action cannot be done
  - qol: shift+alt will open the tgui loot panel on any tile without being intercepted
      by items that may be on the tile
  - tweak: Non-human mobs now also benefit from held id cards and some economy features
      (dexterity checks still apply).
  - refactor: Refactored, improve, and rename canUseTopic to be can_perform_action
      that now uses bitflags to determine if a mob can perform an action.
  - refactor: Mouse drag & drop attack chain has been refactored. Report any bugs
      on GitHub
  - refactor: alt right click has been refactored. report bugs on github
  - refactor: Ctrl click & Ctrl shift click has been refactored. Please report bugs
      on GitHub
  - bugfix: Alt click interactions have been refactored, which may lead to unintentional
      changes to gameplay. Report any issues, please.
  - bugfix: Fix runtimes for IV drips, food processors, and gibber
  - bugfix: Fix pAIs interacting with machinery via alt/ctrl clicking.
  - code_imp: most actions now properly check for recursive locs & better adjacency
  - code_imp: improved alt & ctrl click code
  - code_imp: improved mouse drag & drop code
  - code_imp: adds a shift+alt click on proc for living mobs to explicitly open the
      turf statpanel in addition to the already existing alt bind
