author: rkz, IndieanaJones, XDTM, Timberpoes, JohnFulpWillard, Ryll-Ryll, LemonInTheDark,
  Fikou, jlsnow301, NamelessFairy, Rhials, 13spacemen, MrMelbert, SmArtKar, mcbalaam,
  Ghommie, vinylspiders
delete-after: true
changes:
  - balance: Reports show Hazard-5 entities have mutated to keep their important cells
      protected from lava. Reports also indicate that these Hazard-5 entities now
      take longer to detect from Central Command, among other things.
  - rscadd: Positronic brains can now be given a "personality seed" by Alt-clicking
      them, telling ghosts what you plan on using the posibrain for.
  - rscadd: The orbit UI now brings up tooltips to show health, job, and full name
      information.
  - rscadd: The orbit UI now puts disguised names in quotes. Hover to get real name.
  - rscadd: Orbit UI now gives tooltips on SM crystal, nuke disk, and nuclear devices.
  - rscadd: You can now search by job in the orbit UI.
  - rscadd: Orbit UI buttons now reflect health and show job icons.
  - rscadd: ID trims now have an orbit icon variable for display on the observer menu.
  - rscadd: Blobs now get antag info screens and style text for victories.
  - rscadd: Blob minions get objectives (protect the core!).
  - rscadd: Many minor antagonists now have objectives.
  - rscadd: Ghost notifications have been upgraded to their own announcements.
  - rscadd: AFK players are greyed out in the orbit UI.
  - rscadd: Living NPCs now display health in the orbit UI.
  - rscadd: Icons displayed are now based on hud icons, including icons for player-visible
      antagonists.
  - rscadd: You can now sort by job department in the orbit UI.
  - rscadd: Round ending "critical" items will be listed at the top of the orbit UI.
  - rscadd: Your current orbit target is highlighted in the orbit UI.
  - qol: The orbit menu now sorts antagonists into groups more effectively, with some
      getting new named groups.
  - qol: Everything deadchat controlled will now be highlighted in the orbit menu.
  - qol: Fugitives, Bounty Hunters, and Paradox Clones will now appear in the orbit
      menu.
  - qol: The on-screen deadchat popups now contain the notification blurb when hovered.
  - qol: Nearly every ghost alert now features a "VIEW" button, even those with click
      interaction.
  - qol: The "Explosive Planted" alert for C4 actually shows the C4.
  - qol: Ghost orbit menu now always displays a person's real name and roundstart
      job, and cannot be fooled by disguises.
  - qol: All antagonists are now visible to admins in the orbit menu.
  - rscdel: Ghost alerts no longer show the entire message in the tooltip; replaced
      with titles.
  - bugfix: Observers can no longer click on alert icons to perform actions when auto-observing
      players.
  - bugfix: Ghosts can now enter a posibrain that has already had a player in it before.
  - bugfix: Stealthed admins orbiting something will no longer count for that atom's
      orbiter count.
  - bugfix: Fixes some weird behavior with items falling out of your hands when space
      moving.
  - bugfix: Ghost alerts now resize to 32x32 if larger.
  - bugfix: Orbit UI buttons no longer clip on extra long names.
  - bugfix: Sorting for disguised names should work better.
  - bugfix: ERTs should now be properly grouped in the orbit UI.
  - bugfix: Orbit heatmap is now working properly.
  - bugfix: Blob minions are now sorted into biohazards in orbit UI.
  - bugfix: AI eyes, megafauna and robots will appear in the orbit menu NPC section
      again.
  - bugfix: Ghost alerts have been tuned down a bit.
  - bugfix: The screen alert no longer breaks ghost UI when it's huge.
  - bugfix: Blocks mobs from trying to physically interact with some of their HUD
      elements.
  - bugfix: Fixed an issue preventing space ninjas from having a HUD icon.
  - code_imp: Notify ghost alerts and healing robotic limbs' code brought up to coding
      standards.
  - code_imp: Orbit UI heatmap is now toggleable with health.
  - code_imp: The notify_ghosts proc has been cleaned up.
  - refactor: Refactored Orbit into a folder.
  - refactor: Refactors some blob & blob minion code.
  - refactor: Refactors code in several antag datums.
  - admin: Traitor panel should have slightly more sane categories.
  - admin: Fixes admin observe showing all antags as revs upon enabling Real Name
      Display.
  - admin: Admins can now filter observable mobs by ckey.
